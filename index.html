<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Detector</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee+Inline&family=Anton&family=VT323&display=swap" rel="stylesheet">
<style>
  /* ===== Default palette (overwritten per detector) ===== */
  :root {
    --c1: #ff1f8f;  /* primary accent (hot pink) */
    --c2: #00f0ff;  /* secondary accent (electric) */
    --c3: #ffcc00;  /* tertiary accent (gold) */
    --c4: #ff0040;  /* danger / max */
    --bg-deep: #0a0014;
    --bg-mid:  #2a0030;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow-x: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; }

  body {
    font-family: 'Anton', sans-serif;
    background:
      radial-gradient(ellipse at 20% 10%, color-mix(in srgb, var(--c1) 35%, transparent), transparent 50%),
      radial-gradient(ellipse at 80% 90%, color-mix(in srgb, var(--c2) 25%, transparent), transparent 50%),
      radial-gradient(ellipse at 50% 50%, color-mix(in srgb, var(--c3) 10%, transparent), transparent 60%),
      linear-gradient(180deg, var(--bg-deep), var(--bg-mid));
    color: white;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(16px, 4vw, 40px) clamp(12px, 3vw, 32px);
    padding-bottom: 230px;
    position: relative;
    transition: background 0.5s;
  }
  body.is-home { padding-bottom: 40px; }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 40px);
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: overlay;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 50%, transparent 30%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 1;
  }

  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .stars span {
    position: absolute;
    width: 6px; height: 6px;
    background: var(--c3);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--c3), 0 0 24px var(--c3);
    opacity: 0.7;
    animation: twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { transform: scale(0.6); opacity: 0.3; }
    50% { transform: scale(1.2); opacity: 1; }
  }

  /* ===== Home screen ===== */
  #home {
    z-index: 5;
    position: relative;
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding-top: 12px;
  }
  .home-title {
    font-family: 'Bungee Inline', cursive;
    font-size: clamp(2.6rem, 11vw, 5rem);
    line-height: 0.95;
    color: white;
    text-shadow:
      3px 3px 0 var(--c1),
      6px 6px 0 var(--c2),
      9px 9px 30px rgba(0,0,0,0.6);
    transform: rotate(-2deg);
    text-align: center;
  }
  .home-tagline {
    font-family: 'VT323', monospace;
    font-size: clamp(1rem, 3.5vw, 1.3rem);
    color: var(--c3);
    letter-spacing: 0.3em;
    text-align: center;
    text-transform: uppercase;
  }
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    width: 100%;
    margin-top: 12px;
  }
  .tile {
    --tc1: var(--c1);
    --tc2: var(--c2);
    --tc3: var(--c3);
    background: linear-gradient(145deg,
      color-mix(in srgb, var(--tc1) 20%, rgba(0,0,0,0.5)),
      color-mix(in srgb, var(--tc2) 15%, rgba(0,0,0,0.7)));
    border: 3px solid var(--tc3);
    border-radius: 18px;
    padding: 24px 18px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    text-align: center;
    box-shadow: 0 0 0 rgba(0,0,0,0);
    position: relative;
    overflow: hidden;
    color: white;
    -webkit-tap-highlight-color: transparent;
  }
  .tile:hover, .tile:focus {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 8px 30px color-mix(in srgb, var(--tc1) 50%, transparent);
    outline: none;
  }
  .tile-name {
    font-family: 'Bungee Inline', cursive;
    font-size: clamp(1.4rem, 5vw, 1.9rem);
    color: white;
    text-shadow: 2px 2px 0 var(--tc1), 4px 4px 0 var(--tc2);
    margin-bottom: 8px;
  }
  .tile-song {
    font-family: 'VT323', monospace;
    font-size: 1rem;
    color: var(--tc3);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .tile-emoji { font-size: 2rem; margin-bottom: 8px; }

  /* ===== Detector screen ===== */
  #detector { display: none; width: 100%; flex-direction: column; align-items: center; }
  body.show-detector #home { display: none; }
  body.show-detector #detector { display: flex; }

  .back-btn {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 60;
    background: rgba(0,0,0,0.5);
    border: 2px solid var(--c3);
    color: var(--c3);
    font-family: 'VT323', monospace;
    font-size: 1rem;
    letter-spacing: 0.15em;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .back-btn:hover { background: rgba(0,0,0,0.8); }

  header {
    text-align: center;
    z-index: 5;
    position: relative;
    margin-top: 8px;
  }
  .title {
    font-family: 'Bungee Inline', cursive;
    font-size: clamp(2.2rem, 9vw, 5.5rem);
    line-height: 0.95;
    letter-spacing: 0.02em;
    color: white;
    text-shadow:
      3px 3px 0 var(--c1),
      6px 6px 0 var(--c2),
      9px 9px 30px rgba(0,0,0,0.6);
    transform: rotate(-2deg);
  }
  .subtitle {
    font-family: 'VT323', monospace;
    font-size: clamp(0.9rem, 3.5vw, 1.4rem);
    color: var(--c3);
    margin-top: 12px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.4; } }

  /* ===== Meter ===== */
  .meter-wrap {
    z-index: 5;
    position: relative;
    width: min(86vw, 380px);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 16px;
  }
  .meter-svg { width: 100%; height: 100%; overflow: visible; }
  .meter-bg { fill: rgba(0,0,0,0.6); stroke: var(--c3); stroke-width: 4; filter: drop-shadow(0 0 20px color-mix(in srgb, var(--c3) 40%, transparent)); }
  .meter-track { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 22; stroke-linecap: round; }
  .meter-fill {
    fill: none;
    stroke: url(#freakGradient);
    stroke-width: 22;
    stroke-linecap: butt;
    stroke-dasharray: 0 1000;
    transition: stroke-dasharray 0.08s linear;
    filter: drop-shadow(0 0 12px var(--c1));
  }
  .tick { stroke: rgba(255,255,255,0.5); stroke-width: 2; }
  .tick-label { fill: rgba(255,255,255,0.7); font-family: 'VT323', monospace; font-size: 14px; }

  .needle-pivot { fill: var(--c3); stroke: #000; stroke-width: 2; filter: drop-shadow(0 0 8px var(--c3)); }
  .hand-stick {
    stroke: white;
    stroke-width: 4;
    stroke-linecap: round;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.7));
  }
  .hand-tip {
    fill: var(--c4);
    stroke: white;
    stroke-width: 2;
    filter: drop-shadow(0 0 10px var(--c4)) drop-shadow(0 0 20px var(--c4));
  }

  .level-readout {
    position: absolute;
    bottom: -10px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Bungee Inline', cursive;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    color: var(--c3);
    text-shadow: 0 0 20px var(--c3), 2px 2px 0 #000;
    white-space: nowrap;
  }
  .meter-label {
    position: absolute;
    top: 18%;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Anton', sans-serif;
    font-size: clamp(0.7rem, 2.5vw, 1rem);
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
  }

  .verdict {
    z-index: 5;
    position: relative;
    text-align: center;
    min-height: 4em;
    font-family: 'Bungee Inline', cursive;
    font-size: clamp(1.4rem, 5.5vw, 2.2rem);
    line-height: 1.15;
    color: white;
    text-shadow: 0 0 24px currentColor;
    padding: 0 20px;
    margin-bottom: 8px;
    margin-top: 20px;
  }

  .instructions {
    z-index: 5;
    position: relative;
    text-align: center;
    font-family: 'VT323', monospace;
    font-size: clamp(1rem, 3.5vw, 1.3rem);
    letter-spacing: 0.2em;
    color: var(--c2);
    text-transform: uppercase;
    padding-bottom: 8px;
  }
  .instructions .blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== Start overlay ===== */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10, 0, 20, 0.92);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    z-index: 100;
    cursor: pointer;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay-title {
    font-family: 'Bungee Inline', cursive;
    font-size: clamp(2rem, 10vw, 5rem);
    color: var(--c1);
    text-shadow: 4px 4px 0 var(--c3), 8px 8px 0 var(--c2);
    margin-bottom: 30px;
    transform: rotate(-3deg);
    text-align: center;
  }
  .overlay-cta {
    font-family: 'VT323', monospace;
    font-size: clamp(1.4rem, 5vw, 2rem);
    color: var(--c3);
    letter-spacing: 0.3em;
    border: 3px dashed var(--c3);
    padding: 18px 36px;
    animation: shimmer 1.2s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%, 100% { box-shadow: 0 0 20px var(--c3); transform: scale(1); }
    50% { box-shadow: 0 0 50px var(--c1); transform: scale(1.04); }
  }

  @keyframes freakOut {
    0%, 100% { transform: translate(0,0) rotate(0); }
    20% { transform: translate(-4px, 2px) rotate(-0.6deg); }
    40% { transform: translate(3px, -2px) rotate(0.6deg); }
    60% { transform: translate(-3px, -1px) rotate(-0.4deg); }
    80% { transform: translate(2px, 3px) rotate(0.4deg); }
  }
  body.freaking { animation: freakOut 0.18s linear infinite; }

  /* Verdict color tiers based on level */
  body[data-level="0"] .verdict { color: rgba(255,255,255,0.5); }
  body[data-level="1"] .verdict { color: var(--c2); }
  body[data-level="2"] .verdict { color: var(--c3); }
  body[data-level="3"] .verdict { color: var(--c1); }
  body[data-level="4"] .verdict { color: var(--c4); }

  /* ===== Slider ===== */
  #slider-wrap {
    position: fixed;
    bottom: 140px;
    left: 50%;
    transform: translateX(-50%);
    width: min(420px, 92vw);
    z-index: 50;
    padding: 14px 18px 10px;
    background: rgba(0,0,0,0.35);
    border: 2px solid var(--c3);
    border-radius: 14px;
    box-shadow: 0 0 30px color-mix(in srgb, var(--c3) 25%, transparent), inset 0 0 20px rgba(0,0,0,0.5);
  }
  .slider-labels {
    display: flex;
    justify-content: space-between;
    font-family: 'VT323', monospace;
    font-size: 0.95rem;
    color: var(--c3);
    letter-spacing: 0.15em;
    margin-bottom: 8px;
    text-shadow: 0 0 6px var(--c3);
  }
  #freakSlider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 18px;
    background: linear-gradient(90deg, var(--c2) 0%, var(--c3) 50%, var(--c1) 85%, var(--c4) 92%, var(--c4) 100%);
    border-radius: 9px;
    outline: none;
    border: 1.5px solid rgba(255,255,255,0.4);
    cursor: pointer;
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.4), 0 0 10px color-mix(in srgb, var(--c1) 30%, transparent);
  }
  #freakSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff 0%, var(--c3) 50%, #888 100%);
    border: 2px solid #000;
    cursor: grab;
    box-shadow: 0 0 12px var(--c3), 0 0 24px var(--c1);
  }
  #freakSlider::-moz-range-thumb {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff 0%, var(--c3) 50%, #888 100%);
    border: 2px solid #000;
    cursor: grab;
    box-shadow: 0 0 12px var(--c3), 0 0 24px var(--c1);
  }

  /* ===== Audio player ===== */
  #audio-wrap {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: min(380px, 94vw);
    z-index: 50;
    padding: 12px 14px;
    background: rgba(0,0,0,0.5);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    text-align: center;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #audio-wrap.armed {
    border-color: var(--c1);
    box-shadow: 0 0 30px var(--c1), 0 0 60px var(--c4);
    animation: armedPulse 0.6s ease-in-out infinite alternate;
  }
  @keyframes armedPulse {
    from { box-shadow: 0 0 20px var(--c1); }
    to   { box-shadow: 0 0 50px var(--c1), 0 0 80px var(--c4); }
  }
  .audio-label {
    font-family: 'Bungee Inline', cursive;
    font-size: clamp(0.9rem, 3.5vw, 1.1rem);
    color: var(--c3);
    letter-spacing: 0.1em;
    text-shadow: 0 0 8px var(--c3);
    margin-bottom: 6px;
  }
  #audio-wrap.armed .audio-label {
    color: var(--c1);
    text-shadow: 0 0 10px var(--c1), 0 0 20px var(--c4);
  }
  .audio-status {
    font-family: 'VT323', monospace;
    font-size: 0.95rem;
    color: var(--c2);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 4px;
    min-height: 1.2em;
  }
  .audio-links {
    font-family: 'VT323', monospace;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.1em;
  }
  .audio-links a {
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    margin: 0 4px;
  }
  .audio-links a:hover { color: var(--c3); text-decoration: underline; }
</style>
</head>

<!-- ============== HOME SCREEN ============== -->
<div id="home">

</div>

<!-- ============== DETECTOR SCREEN ============== -->
<div id="detector">

          <stop offset="0%"   style="stop-color:var(--c2)" />
          <stop offset="33%"  style="stop-color:var(--c3)" />
          <stop offset="66%"  style="stop-color:var(--c1)" />

      <g id="ticks"></g>
      <line id="handStick" class="hand-stick" x1="150" y1="150" x2="72.22" y2="227.78" />
      <circle id="handTip" class="hand-tip" cx="72.22" cy="227.78" r="11" />

    <div class="meter-label" id="meterLabel">★ FREAK-O-METER ★</div>
    <div class="level-readout" id="readout">LVL 0</div>

  <div class="verdict" id="verdict">awaiting freakiness…</div>

  <div class="instructions">
    <span class="blink">▸</span> slide right to detect <span class="blink">◂</span>
  </div>

  <div id="slider-wrap">
    <div class="slider-labels">
      <span id="sliderL">NONE</span>
      <span id="sliderM">FREAKY</span>
      <span id="sliderR">SUPER</span>
    </div>
    <input type="range" id="freakSlider" min="0" max="100" value="0" step="1" />
  </div>

  <div id="audio-wrap">
    <div class="audio-label" id="audioLabel">♫ SONG ♫</div>
    <audio id="audioEl" preload="auto"></audio>
    <div class="audio-status" id="audioStatus">loading preview…</div>
    <div class="audio-links" id="audioLinks"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="overlay-title" id="overlayTitle">FREAK<br>DETECTOR</div>
    <div class="overlay-cta">TAP TO START</div>
  </div>
</div>

        track:  'The Meow Mix Commercial - Main Theme',
        album:  'The Meow Mix Commercial',
        appleUrl:   'https://music.apple.com/us/album/the-meow-mix-commercial-main-theme-single/1388206430',
        spotifyUrl: 'https://open.spotify.com/album/05YEx9GWAEnGvagncgv8G2',
      },
      emoji: '🐱'
    }
  ];

  // ============== DOM REFS ==============
  const body = document.body;
  const home = document.getElementById('home');
  const tilesEl = document.getElementById('tiles');
  const detector = document.getElementById('detector');
  const backBtn = document.getElementById('backBtn');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const detTitle = document.getElementById('detTitle');
  const meterLabel = document.getElementById('meterLabel');
  const lblNone = document.getElementById('lblNone');
  const lblMid = document.getElementById('lblMid');
  const lblSuper = document.getElementById('lblSuper');
  const sliderL = document.getElementById('sliderL');
  const sliderM = document.getElementById('sliderM');
  const sliderR = document.getElementById('sliderR');
  const fillArc = document.getElementById('fillArc');
  const handStick = document.getElementById('handStick');
  const handTip = document.getElementById('handTip');
  const readout = document.getElementById('readout');
  const verdict = document.getElementById('verdict');
  const slider = document.getElementById('freakSlider');
  const audioWrap = document.getElementById('audio-wrap');
  const audioLabel = document.getElementById('audioLabel');
  const audioStatus = document.getElementById('audioStatus');
  const audioEl = document.getElementById('audioEl');
  const audioLinks = document.getElementById('audioLinks');

  // ============== TWINKLING STARS ==============
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 30; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 2.4) + 's';
    s.style.transform = `scale(${0.4 + Math.random() * 0.8})`;
    starsEl.appendChild(s);
  }

  // ============== TICK MARKS ==============
  const ticksG = document.getElementById('ticks');
  for (let i = 0; i <= 10; i++) {
    const deg = -135 + (i / 10) * 270;
    const rad = deg * Math.PI / 180;
    const sinA = Math.sin(rad), cosA = Math.cos(rad);
    const x1 = 150 + sinA * 120;
    const y1 = 150 - cosA * 120;
    const r2 = (i % 5 === 0 ? 132 : 128);
    const x2 = 150 + sinA * r2;
    const y2 = 150 - cosA * r2;
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('class','tick');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('stroke-width', i % 5 === 0 ? 3 : 1.5);
    ticksG.appendChild(line);
  }

  // ============== HOME TILES ==============
  DETECTORS.forEach(d => {
    const tile = document.createElement('button');
    tile.className = 'tile';
    tile.style.setProperty('--tc1', d.colors.c1);
    tile.style.setProperty('--tc2', d.colors.c2);
    tile.style.setProperty('--tc3', d.colors.c3);
    tile.innerHTML = `
      <div class="tile-emoji">${d.emoji}</div>
      <div class="tile-name">${d.name}<br>DETECTOR</div>
      <div class="tile-song">${d.song.track} — ${d.song.artist}</div>
    `;
    tile.addEventListener('click', () => loadDetector(d));
    tilesEl.appendChild(tile);
  });

  backBtn.addEventListener('click', () => returnHome());

  // ============== STATE ==============
  const SUPER_THRESHOLD = 92;
  let currentDetector = null;
  let level = 0;
  let sliderValue = 0;
  let started = false;

  let audioCtx = null;
  let beepGain = null;
  let beepTimer = null;
  let beepActive = false;

  let previewLoaded = false;
  let previewPlaying = false;
  let previewFetchAttempted = false;

  // ============== LOAD/UNLOAD DETECTOR ==============
  function loadDetector(d) {
    currentDetector = d;
    // Apply color palette via CSS variables
    document.documentElement.style.setProperty('--c1', d.colors.c1);
    document.documentElement.style.setProperty('--c2', d.colors.c2);
    document.documentElement.style.setProperty('--c3', d.colors.c3);
    document.documentElement.style.setProperty('--c4', d.colors.c4);
    document.documentElement.style.setProperty('--bg-deep', d.colors.bgDeep);
    document.documentElement.style.setProperty('--bg-mid',  d.colors.bgMid);
    // Apply text content
    detTitle.innerHTML = d.title;
    overlayTitle.innerHTML = d.title;
    meterLabel.textContent = d.meterLabel;
    lblNone.textContent  = d.labels.low;
    lblMid.textContent   = d.labels.mid;
    lblSuper.textContent = d.labels.high;
    sliderL.textContent  = d.labels.low;
    sliderM.textContent  = d.labels.mid;
    sliderR.textContent  = d.labels.high;
    audioLabel.textContent = `♫ ${d.song.track.toUpperCase()} — ${d.song.artist} ♫`;
    audioLinks.innerHTML = `
      <a href="${d.song.appleUrl}" target="_blank" rel="noopener">Apple Music ↗</a>
      <span>·</span>
      <a href="${d.song.spotifyUrl}" target="_blank" rel="noopener">Spotify ↗</a>
    `;
    document.title = `${d.name} Detector`;
    // Reset slider
    slider.value = 0;
    sliderValue = 0;
    level = 0;
    // Reset audio state
    if (previewPlaying) { audioEl.pause(); audioEl.currentTime = 0; previewPlaying = false; }
    audioEl.removeAttribute('src');
    previewLoaded = false;
    previewFetchAttempted = false;
    audioStatus.textContent = 'loading preview…';
    audioWrap.classList.remove('armed');
    body.classList.remove('freaking');
    // Show detector screen, hide home
    body.classList.remove('is-home');
    body.classList.add('show-detector');
    overlay.classList.remove('hidden');
    started = false;
    // Reset URL hash for shareability
    history.replaceState(null, '', '#' + d.id);
  }

  function returnHome() {
    stopBeeps();
    if (previewPlaying) { audioEl.pause(); previewPlaying = false; }
    body.classList.remove('show-detector');
    body.classList.add('is-home');
    body.classList.remove('freaking');
    overlay.classList.add('hidden');
    history.replaceState(null, '', '#');
  }

  // ============== AUDIO: BEEPS (Web Audio sine bleeps) ==============
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    beepGain = audioCtx.createGain();
    beepGain.gain.value = 0.25;
    beepGain.connect(audioCtx.destination);
  }

  // One short high-pitched bleep (sine wave with quick envelope)
  function playBeep() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    // Pitch climbs with slider value — adds excitement as it speeds up
    const norm = Math.min(sliderValue, SUPER_THRESHOLD - 1) / (SUPER_THRESHOLD - 1);
    const baseFreq = 880;     // A5
    const topFreq  = 2200;    // ~C#7
    const freq = baseFreq + (topFreq - baseFreq) * norm;

    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(1.0, t + 0.005);  // very quick attack
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08); // 80ms tone

    osc.connect(g).connect(beepGain);
    osc.start(t);
    osc.stop(t + 0.1);
  }

  function scheduleNextBeep() {
    if (!beepActive) return;
    const s = Math.min(sliderValue, SUPER_THRESHOLD - 1);
    if (s < 1) {
      beepTimer = setTimeout(scheduleNextBeep, 200);
      return;
    }
    const norm = s / (SUPER_THRESHOLD - 1);
    const minMs = 50, maxMs = 1400;
    const interval = maxMs * Math.pow(minMs / maxMs, norm);
    const jitter = interval * 0.08 * (Math.random() - 0.5);
    playBeep();
    beepTimer = setTimeout(scheduleNextBeep, Math.max(35, interval + jitter));
  }

  function startBeeps() {
    if (beepActive) return;
    beepActive = true;
    scheduleNextBeep();
  }

  function stopBeeps() {
    beepActive = false;
    if (beepTimer) { clearTimeout(beepTimer); beepTimer = null; }
  }

  // ============== AUDIO: iTunes preview (per detector) ==============
  function applyResults(results, d) {
    let pick = results.find(r =>
      new RegExp(d.song.album, 'i').test(r.collectionName || '') &&
      new RegExp('^' + d.song.track.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i').test(r.trackName || '') &&
      !/live|remix|club|instrumental|version/i.test(r.trackName || '')
    );
    if (!pick) {
      pick = results.find(r =>
        new RegExp('^' + d.song.track.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i').test(r.trackName || '') &&
        new RegExp(d.song.artist, 'i').test(r.artistName || '') &&
        !/live|remix|club|instrumental|version/i.test(r.trackName || '')
      );
    }
    if (!pick) {
      pick = results.find(r =>
        new RegExp(d.song.track, 'i').test(r.trackName || '') &&
        new RegExp(d.song.artist, 'i').test(r.artistName || '')
      );
    }
    if (!pick) pick = results[0];
    if (pick && pick.previewUrl) {
      audioEl.src = pick.previewUrl;
      previewLoaded = true;
      audioStatus.textContent = 'ready — slide to play';
      return true;
    }
    return false;
  }

  function fetchPreviewJSONP(d) {
    audioStatus.textContent = 'fetching preview (jsonp)…';
    const callbackName = 'itunesCb_' + Math.random().toString(36).slice(2, 10);
    const timeout = setTimeout(() => {
      if (!previewLoaded) audioStatus.textContent = 'preview unavailable — see store links below';
      cleanup();
    }, 8000);
    function cleanup() {
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[callbackName] = (data) => {
      clearTimeout(timeout);
      const results = (data && data.results) || [];
      if (!applyResults(results, d)) audioStatus.textContent = 'preview unavailable';
      cleanup();
    };
    const script = document.createElement('script');
    script.src = 'https://itunes.apple.com/search?term=' + encodeURIComponent(d.song.track + ' ' + d.song.artist)
                + '&entity=song&limit=25&callback=' + callbackName;
    script.onerror = () => {
      clearTimeout(timeout);
      audioStatus.textContent = 'preview unavailable — see store links below';
      cleanup();
    };
    document.head.appendChild(script);
  }

  function fetchPreview() {
    if (previewFetchAttempted || !currentDetector) return;
    previewFetchAttempted = true;
    audioStatus.textContent = 'fetching preview…';
    const d = currentDetector;
    fetch('https://itunes.apple.com/search?term=' + encodeURIComponent(d.song.track + ' ' + d.song.artist) + '&entity=song&limit=25')
      .then(r => r.json())
      .then(data => {
        const results = data.results || [];
        if (!applyResults(results, d)) audioStatus.textContent = 'preview unavailable';
      })
      .catch(err => {
        console.warn('iTunes CORS fetch failed, trying JSONP:', err);
        fetchPreviewJSONP(d);
      });
  }

  function startPreview() {
    if (!previewLoaded || previewPlaying) return;
    audioEl.currentTime = 0;
    const p = audioEl.play();
    if (p && p.catch) {
      p.then(() => {
        previewPlaying = true;
        audioStatus.textContent = '♫ NOW PLAYING ♫';
      }).catch(err => {
        audioStatus.textContent = 'tap player to play';
        console.warn('audio play blocked:', err);
      });
    } else {
      previewPlaying = true;
      audioStatus.textContent = '♫ NOW PLAYING ♫';
    }
  }

  function stopPreview() {
    if (!previewPlaying) return;
    audioEl.pause();
    audioEl.currentTime = 0;
    previewPlaying = false;
  }

  audioEl.addEventListener('ended', () => {
    previewPlaying = false;
    audioStatus.textContent = 'preview ended — slide back to replay';
  });

  audioWrap.addEventListener('click', (e) => {
    if (e.target.closest('a')) return;
    if (sliderValue >= SUPER_THRESHOLD && previewLoaded && !previewPlaying) {
      startPreview();
    }
  });

  // ============== INTERACTION ==============
  function updateAudioFromSlider() {
    if (!started) return;
    if (sliderValue >= SUPER_THRESHOLD) {
      stopBeeps();
      audioWrap.classList.add('armed');
      if (!previewPlaying && previewLoaded) startPreview();
      else if (!previewLoaded) audioStatus.textContent = 'preview not loaded — see links';
    } else {
      audioWrap.classList.remove('armed');
      if (previewPlaying) stopPreview();
      if (previewLoaded) audioStatus.textContent = 'ready — slide to play';
      if (sliderValue >= 1) {
        if (!beepActive) startBeeps();
      } else {
        stopBeeps();
      }
    }
  }

  function start() {
    if (started) return;
    started = true;
    overlay.classList.add('hidden');
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    fetchPreview();
    updateAudioFromSlider();
  }

  overlay.addEventListener('click', start);
  overlay.addEventListener('touchstart', (e) => { e.preventDefault(); start(); }, { passive: false });

  slider.addEventListener('input', () => {
    sliderValue = parseFloat(slider.value);
    updateAudioFromSlider();
  });

  // ============== RENDER LOOP ==============
  function tick() {
    level += (sliderValue - level) * 0.22;
    if (Math.abs(level - sliderValue) < 0.05) level = sliderValue;

    fillArc.setAttribute('stroke-dasharray', `${level} ${100 - level}`);
    const angleDeg = -135 + (level / 100) * 270;
    const angleRad = angleDeg * Math.PI / 180;
    const tipX = 150 + Math.sin(angleRad) * 110;
    const tipY = 150 - Math.cos(angleRad) * 110;
    handStick.setAttribute('x2', tipX);
    handStick.setAttribute('y2', tipY);
    handTip.setAttribute('cx', tipX);
    handTip.setAttribute('cy', tipY);
    readout.textContent = `LVL ${Math.round(level)}`;

    if (currentDetector) {
      let bucket = 0;
      if (level >= 5)  bucket = 1;
      if (level >= 25) bucket = 2;
      if (level >= 50) bucket = 3;
      if (level >= 75) bucket = 4;
      if (level >= SUPER_THRESHOLD) bucket = 5;
      verdict.textContent = currentDetector.verdicts[bucket];
      body.dataset.level = Math.min(4, bucket);
      body.classList.toggle('freaking', level >= SUPER_THRESHOLD);
    }

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ============== DEEP LINKING (#freak, #owt, etc.) ==============
  function checkHash() {
    const id = (window.location.hash || '').replace(/^#/, '').trim().toLowerCase();
    if (!id) return;
    const d = DETECTORS.find(d => d.id === id);
    if (d) loadDetector(d);
  }
  window.addEventListener('hashchange', checkHash);
  checkHash();
})();
</script>
</body>
</html>
